<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a12" />
<title>Hollowdeep</title>
</head>
<body class="in-menu">
<canvas id="game"></canvas>
<div id="hud">
  <div id="flash"></div>
  <div id="crosshair"></div>
  <div id="vitals"></div>
  <div id="fps"></div>
  <canvas id="minimap" width="172" height="172"></canvas>
  <div id="clock"></div>
  <div id="flight"><div></div></div>
  <div id="breath"></div>
  <div id="prompt"></div>
  <div id="biome-title"></div>
  <div id="topbars"><div id="bossbar"></div><div id="eventbar"></div></div>
  <div id="itemname"></div>
  <div id="hotbar"></div>
  <div id="messages"></div>
  <div id="debug"></div>
  <div id="death"><h2>You Were Slain</h2><p></p></div>
  <div id="inventory">
    <button class="close px-btn icon" title="Close"></button>
    <div>
      <div class="chest"></div>
      <h2>Inventory</h2>
      <div style="display:flex; gap:10px">
        <div class="equip"></div>
        <div class="grid"></div>
      </div>
      <div class="hint">
        <span><kbd>LMB</kbd> pick up / place</span>
        <span><kbd>RMB</kbd> split</span>
        <span><kbd>Shift</kbd> quick-move</span>
        <span><kbd>Tab</kbd> close</span>
      </div>
    </div>
    <div class="crafting">
      <h2>Crafting</h2>
      <div class="craft-list"></div>
      <div class="craft-info"></div>
    </div>
  </div>
</div>
<div id="tooltip"></div>
<div id="cursor-stack"></div>
<div id="menu" class="show">
  <div class="shade"></div>
  <div class="screen show" id="loading">
    <div class="logo"><span class="word">Hollowdeep</span><span class="tag">Dig. Build. Delve.</span></div>
    <div class="load-bar"><div></div></div>
    <div class="status">Starting</div>
    <div class="tip"></div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
